    <path d="M3.5 0l2-1.5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Analytics bars -->
    <rect x="9" y="6.5" width="2" height="3.5" rx="0.8" fill="rgba(255,255,255,0.7)"/>
    <rect x="11.8" y="4.5" width="2" height="5.5" rx="0.8" fill="rgba(255,255,255,0.7)"/>
