<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="97" fill="url(#bg)"/>
  <rect x="67" y="67" width="379" height="379" rx="82" fill="url(#accent)"/>
  <g transform="translate(256, 240) scale(16)">
    <!-- Back person (network contact) -->
    <circle cx="6.5" cy="-2.5" r="2.4" fill="rgba(255,255,255,0.45)"/>
    <path d="M2.5 6.5c0-2.2 1.8-3.8 4-3.8s4 1.6 4 3.8v.7h-8v-.7z" fill="rgba(255,255,255,0.45)"/>
